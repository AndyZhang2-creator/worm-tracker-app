name: Sync to Hugging Face Spaces

# Mirrors this repo to a Hugging Face Space so the live site redeploys
# automatically whenever master changes. No manual `git push space` needed.
#
# One-time setup (Settings -> Secrets and variables -> Actions):
#   * Secret   HF_TOKEN     — a Hugging Face WRITE token (hf.co/settings/tokens)
#   * Variable HF_SPACE_ID  — your Space id, e.g. "your-user/worm-tracker-app"
#
# After that, every push to master (including merging a PR) rebuilds the Space.
# You can also trigger it by hand from the Actions tab (workflow_dispatch).

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # HF rejects shallow pushes
          lfs: true        # carry model/best.pt if it's tracked via Git LFS

      - name: Push to the Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "::error::Set the HF_TOKEN secret and HF_SPACE_ID variable in repo settings first." >&2
            exit 1
          fi
          # HF Spaces serve from the 'main' branch; force so the mirror always
          # matches master even if the Space history diverged.
          git push --force \
            "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}.git" \
            HEAD:main
